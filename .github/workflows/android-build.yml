name: Android Build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" > /dev/null
          # compileSdk proyek = 37. Kalau platform belum ada di repo SDK,
          # biarkan Gradle/AGP yang mengunduhnya (lisensi sudah diterima).
          "$SDKMANAGER" --install "platforms;android-37" > /dev/null \
            || echo "::warning::platforms;android-37 tidak tersedia via sdkmanager, mengandalkan SDK auto-download AGP"

      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-local}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FluxLauncher-${TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/FluxLauncher-${TAG}-release.apk"
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fluxlauncher-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: fluxlauncher-apks
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Build otomatis dari tag ini.

          Catatan: APK release masih ditandatangani dengan debug keystore proyek
          (`signingConfig = debug`), jadi hanya untuk pengujian — bukan untuk Play Store.
          EOF
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "FluxLauncher $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/*.apk --clobber
