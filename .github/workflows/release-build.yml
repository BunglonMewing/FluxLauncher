name: Release APK Build

# Workflow khusus build & rilis APK RELEASE — terpisah penuh dari build debug.
# Dijalankan hanya saat men-tag repo dengan "v*" (atau manual via workflow_dispatch).
# Hasil ditautkan ke GitHub Release: app-release.apk saja (tanpa bundling debug).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Assemble & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" > /dev/null \
            || "$SDKMANAGER" --install "platforms;android-37" > /dev/null \
            || echo "::warning::platform 37 tidak tersedia via sdkmanager, mengandalkan SDK auto-download AGP"

      - name: Build release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect release APK
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="$(printf '%s' "${GITHUB_REF_NAME:-local}" | tr '/ ' '--')"
          cp app/build/outputs/apk/release/app-release.apk "dist/FluxLauncher-${TAG}-release.apk"
          ls -lh dist

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Build release otomatis dari tag ini.

          Catatan: APK release masih ditandatangani dengan debug keystore proyek
          (`signingConfig = debug`), jadi hanya untuk pengujian — bukan untuk Play Store.
          EOF
          gh release view "$TAG" > /dev/null 2>&1 \
            || gh release create "$TAG" --title "FluxLauncher $TAG" --notes-file notes.md
          gh release upload "$TAG" dist/*.apk --clobber
